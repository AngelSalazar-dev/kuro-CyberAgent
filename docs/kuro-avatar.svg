<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kuro avatar">
  <defs>
    <linearGradient id="kuroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00cc33"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo oscuro -->
  <rect width="512" height="512" fill="#040704"/>

  <!-- Círculo exterior tipo Claude -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#kuroGrad)" stroke-width="14" opacity="0.9"/>

  <!-- Círculo interior -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#kuroGrad)" stroke-width="6" opacity="0.5"/>

  <!-- Ojo / forma central tipo Claude -->
  <path d="M 256 120 Q 256 120 200 180 L 256 256 L 312 180 Q 312 180 256 120 Z" fill="url(#kuroGrad)" filter="url(#glow)"/>

  <!-- Punto central (pupila) -->
  <circle cx="256" cy="200" r="22" fill="#ffffff"/>

  <!-- Línea horizontal inferior (estilo Claude) -->
  <path d="M 180 330 Q 256 380 332 330" fill="none" stroke="url(#kuroGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- Pequeños puntos decorativos -->
  <circle cx="256" cy="360" r="6" fill="url(#kuroGrad)" opacity="0.7"/>
  <circle cx="210" cy="340" r="4" fill="url(#kuroGrad)" opacity="0.5"/>
  <circle cx="302" cy="340" r="4" fill="url(#kuroGrad)" opacity="0.5"/>

  <!-- Texto Kuro pequeño en la parte inferior -->
  <text x="256" y="470" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="url(#kuroGrad)" letter-spacing="2">KURO</text>
</svg>
