      <text class="rain" x="461" y="-150" style="animation-duration:6.35s;animation-delay:-0.42s">6C48BBF33</text>
      <text class="rain" x="500" y="-150" style="animation-duration:8.17s;animation-delay:-2.80s">F9243A8F5</text>
