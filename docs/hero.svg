<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="KURO">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="kuroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00cc33"/>
    </linearGradient>
    <linearGradient id="rainfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7dffb0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7dffb0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00ff41" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="420" rx="10"/></clipPath>
  </defs>

  <style>
    .rain { font: 16px ui-monospace, Menlo, Consolas, monospace;
             fill: url(#rainfade); animation: fall linear infinite; }
    @keyframes fall { from { transform: translateY(0); } to { transform: translateY(690px); } }

    /* Base state is fully visible; the loop only dips it briefly. */
    .gl rect { fill: #00ff41;
                animation: flicker 7s steps(1,end) infinite; }
    @keyframes flicker {
      0%, 88%   { opacity: 1; }
      89%       { opacity: 0.62; }
      90%       { opacity: 1; }
      91%       { opacity: 0.38; }
      92%, 100% { opacity: 1; }
    }

    .halo { animation: halo 3.6s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity: .45; } 50% { opacity: .95; } }

    .band { animation: band 3.8s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes band { 0% { transform: translateX(-1280px); }
                       55%,100% { transform: translateX(1280px); } }

    .sweep { animation: sweep 5.4s linear infinite; }
    @keyframes sweep { 0% { transform: translateY(-90px); } 100% { transform: translateY(510px); } }

    .cur { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .tag, .meta { paint-order: stroke; stroke: #040704; stroke-width: 5;
                   stroke-linejoin: round; }
    .tag { font: 600 15px ui-monospace, Menlo, Consolas, monospace;
            letter-spacing: 3.2px; fill: #7dffb0; }
    .meta { font: 13px ui-monospace, Menlo, Consolas, monospace;
             letter-spacing: 1.6px; fill: #0c5a22; }

    @media (prefers-reduced-motion: reduce) {
      .rain, .gl rect, .band, .sweep, .cur, .halo { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#040704"/>

    <!-- Kuro avatar (Claude-style) -->
    <g transform="translate(60, 60)">
      <circle cx="90" cy="90" r="78" fill="none" stroke="url(#kuroGrad)" stroke-width="10" opacity="0.9"/>
      <circle cx="90" cy="90" r="48" fill="none" stroke="url(#kuroGrad)" stroke-width="4" opacity="0.5"/>
      <path d="M 90 52 Q 90 52 70 78 L 90 110 L 110 78 Q 110 78 90 52 Z" fill="url(#kuroGrad)" filter="url(#glow)"/>
      <circle cx="90" cy="86" r="10" fill="#ffffff"/>
      <path d="M 78 142 Q 90 164 102 142" fill="none" stroke="url(#kuroGrad)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Kuro wordmark -->
    <!-- Kuro wordmark -->
    <text x="640" y="175" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="110" font-weight="900" fill="url(#kuroGrad)" filter="url(#glow)" letter-spacing="8">KURO</text>

    <g opacity="0.5"><line x1="0" y1="0" x2="1280" y2="0" stroke="#0a1a0d"/><line x1="0" y1="26" x2="1280" y2="26" stroke="#0a1a0d"/><line x1="0" y1="52" x2="1280" y2="52" stroke="#0a1a0d"/><line x1="0" y1="78" x2="1280" y2="78" stroke="#0a1a0d"/><line x1="0" y1="104" x2="1280" y2="104" stroke="#0a1a0d"/><line x1="0" y1="130" x2="1280" y2="130" stroke="#0a1a0d"/><line x1="0" y1="156" x2="1280" y2="156" stroke="#0a1a0d"/><line x1="0" y1="182" x2="1280" y2="182" stroke="#0a1a0d"/><line x1="0" y1="208" x2="1280" y2="208" stroke="#0a1a0d"/><line x1="0" y1="234" x2="1280" y2="234" stroke="#0a1a0d"/><line x1="0" y1="260" x2="1280" y2="260" stroke="#0a1a0d"/><line x1="0" y1="286" x2="1280" y2="286" stroke="#0a1a0d"/><line x1="0" y1="312" x2="1280" y2="312" stroke="#0a1a0d"/><line x1="0" y1="338" x2="1280" y2="338" stroke="#0a1a0d"/><line x1="0" y1="364" x2="1280" y2="364" stroke="#0a1a0d"/><line x1="0" y1="390" x2="1280" y2="390" stroke="#0a1a0d"/><line x1="0" y1="416" x2="1280" y2="416" stroke="#0a1a0d"/></g>
