    <rect class="band" x="0" y="110" width="300" height="146"
          fill="url(#band)" style="mix-blend-mode:screen"/>
    <rect class="sweep" x="0" y="0" width="1280" height="90" fill="url(#scan)"/>

    <text class="tag" x="640" y="288" text-anchor="middle">net.shell // autonomous coding agent</text>
    <rect class="cur" x="872" y="273" width="10" height="18" fill="#7dffb0"/>

